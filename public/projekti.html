<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManusMano - Projekti</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/loader.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="/scripts/produktiLoader.js" defer></script>
    <script src="/scripts/popup.js" defer></script>
</head>

<body>
    <div class="page-wrapper">
        <header id="header"></header>
        <main class="main-content">
            <section class="hero-podstran" style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(img/HeroProjekti.jpg) center/cover no-repeat;">
                <div class="position-absolute rounded-circle bg-warning"
                    style="width: 15px; height: 15px; top: 20%; left: 10%;"></div>
                <div class="position-absolute rounded-circle bg-danger"
                    style="width: 15px; height: 15px; bottom: 20%; right: 15%;"></div>
                <div class="container py-5 mt-4">
                    <div class="row justify-content-center text-center">
                        <div class="col-lg-8">
                            <h1 class="hero-title fw-bold mb-3">Projekti</h1>
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb justify-content-center mb-0">
                                    <li class="breadcrumb-item">
                                        <a href="index.html"
                                            class="text-white text-decoration-none hover-link">ManusMano</a>
                                    </li>
                                    <li class="breadcrumb-item">
                                        <span class="redText">Projekti</span>
                                    </li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </section>
            <section class="d-flex align-items-center justify-content-center position-relative"
                style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(img/ProjektiBackground.jpg) center/cover no-repeat;">
                <div class="position-absolute rounded-circle bg-warning"
                    style="width: 15px; height: 15px; top: 20%; left: 10%;">
                </div>
                <div class="position-absolute rounded-circle bg-danger"
                    style="width: 15px; height: 15px; bottom: 20%; right: 15%;">
                </div>
                <div class="container">
                    <div class="text-center mb-5">
                        <h6 class="section-subtitle">Naši projekti</h6>
                        <h2 class="section-title white-text">PROJEKTI, KI <span class="redText">DELAJO SPREMEMBO</span></h2>
                    </div>
                    <div class="row g-4" id="projectsContainer">
                        <!-- Trenuten templatee za psamezno kartico -->
                        <template id="projectTemplate">
                            <div class="col-lg-4 col-md-6 mb-4">
                                <div class="campaign-card diagonalCorner h-100 d-flex flex-column position-relative">
                                    <!-- Slika -->
                                    <div class="campaign-image position-relative">
                                        <img src="" alt="" class="diagonalCorner project-image w-100">
                                        <span
                                            class="badge project-difficulty position-absolute top-0 end-0 m-3 py-2 px-3 d-flex align-items-center">
                                            <i class="fas fa-person-hiking me-1" title="Težavnost projekta"></i>
                                            <span>Težavnost</span>
                                        </span>

                                        <!-- UrE pridobljene za vsakofga posameznika za delo -->
                                        <div class="position-absolute rounded-pill bg-danger text-white shadow-sm d-flex align-items-center py-1 px-3"
                                            style="bottom: 15px; right: 20px; z-index: 10;">
                                            <span class="project-duration-hours fs-1 fw-bold lh-1">6</span>
                                            <span class="small fw-medium ms-1">ur</span>
                                        </div>
                                    </div>

                                    <!-- Header -->
                                    <div class="p-4 flex-column flex-grow-1 d-flex justify-content-between gap-3">
                                        <div class="">
                                            <h3 class="campaign-title project-title fs-4 mb-1 overflow-hidden"
                                                style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3;">
                                                Project Title</h3>
                                            <p class="text-muted mb-2 project-organization small"><i class="fas fa-building me-1"></i> <span>Organizacija</span></p>
                                        </div>
                                        <div class="campaignGreyLineH"></div>
                                        <div class="d-flex flex-column">
                                            <!-- lokaCIJa -->
                                            <div class="d-flex mb-2 small">
                                                <div class="d-flex align-items-center">
                                                    <i class="fas fa-location-dot text-danger me-2"></i>
                                                    <span class="project-location">Lokacija</span>
                                                </div>
                                            </div>
                                            <!-- Datumee -->
                                            <div class="d-flex flex-column small">
                                                <div class="d-flex align-items-center mb-1">
                                                    <i class="fas fa-calendar-days text-primary me-2"></i>
                                                    <strong>Izvaja se:</strong> <span
                                                        class="project-date ms-1">Datum</span>
                                                </div>
                                                <div class="d-flex align-items-center">
                                                    <i class="fas fa-calendar-xmark text-info me-2"></i>
                                                    <strong>Prijave do:</strong> <span class="project-deadline ms-1">Rok
                                                        prijave</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="campaignGreyLineH" style="width: 100%;"></div>
                                        <!-- Description -->
                                        <div class="">
                                            <p class="campaign-description project-description mb-3 text-dark fw-medium overflow-hidden text-uppercase"
                                                style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; font-size: 1.1rem;">
                                                Tu bo description projekta</p>
                                            <p class="project-goal mb-0 text-muted small">
                                                <i class="fas fa-clipboard-check text-success me-1"
                                                    title="Cilj projekta"></i>
                                                <span class="project-goal-text fst-italic">Cilj
                                                    projekta</span>
                                            </p>
                                        </div>
                                    </div>
                                    <button class="btn donate-btn" data-project-id="" title="Podrobnosti projekta">
                                        <i class="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <nav aria-label="Project pagination" class="mt-5">
                        <ul class="pagination justify-content-center"></ul>
                    </nav>
                </div>
            </section>
        </main>
        <footer id="footer"></footer>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="/scripts/popup.js"></script>
    </div>
</body>
</html>
