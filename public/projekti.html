<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManusMano - Projekti</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/loader.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="/scripts/produktiLoader.js" defer></script>
    <script src="/scripts/popup.js" defer></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAH-QGfMYHoCgyRcaD1feVQgGO_d8e_d90"></script>
    <script src="https://unpkg.com/@google/markerclustererplus@4.0.1/dist/markerclustererplus.min.js"></script>
    <script src="scripts/mapa.js" defer></script>
</head>

<body>
    <div class="page-wrapper">
        <header id="header"></header>
        <main class="main-content">
            <section class="hero-podstran"
                style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(img/HeroProjekti.jpg) center/cover no-repeat;">
                <div class="position-absolute rounded-circle bg-warning"
                    style="width: 15px; height: 15px; top: 20%; left: 10%; z-index: 3;"></div>
                <div class="position-absolute rounded-circle bg-danger"
                    style="width: 15px; height: 15px; bottom: 20%; right: 15%; z-index: 3;"></div>
                <div class="hero-content">
                    <div class="container">
                        <div class="row justify-content-center text-center">
                            <div class="col-lg-8">
                                <h1 class="hero-title fw-bold mb-3">Projekti</h1>
                                <nav aria-label="breadcrumb">
                                    <ol class="breadcrumb justify-content-center mb-0">
                                        <li class="breadcrumb-item">
                                            <a href="index.html"
                                                class="text-white text-decoration-none hover-link">ManusMano</a>
                                        </li>
                                        <li class="breadcrumb-item">
                                            <span class="redText">Projekti</span>
                                        </li>
                                    </ol>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="d-flex align-items-center justify-content-center position-relative"
                style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(img/ProjektiBackground.jpg) center/cover no-repeat;">
                <div class="position-absolute rounded-circle bg-warning"
                    style="width: 15px; height: 15px; top: 20%; left: 10%;">
                </div>
                <div class="position-absolute rounded-circle bg-danger"
                    style="width: 15px; height: 15px; bottom: 20%; right: 15%;">
                </div>
                <div class="container">
                    <div class="text-center mb-5">
                        <h6 class="section-subtitle">Naši projekti</h6>
                        <h2 class="section-title white-text">PROJEKTI, KI <span class="redText">DELAJO SPREMEMBO</span>
                        </h2>
                    </div>

                    <!-- Filter Sidebar -->
                    <div class="offcanvas offcanvas-end pt-5" tabindex="-1" id="filterSidebar">
                        <div class="offcanvas-header">
                            <h5 class="offcanvas-title">Filtriraj projekte</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                        </div>
                        <div class="offcanvas-body">
                            <form id="filterForm">
                                <!-- Težavnost -->
                                <div class="mb-3">
                                    <label for="tezavnost" class="form-label">Težavnost</label>
                                    <select class="form-select" id="tezavnost" name="tezavnost">
                                        <option value="">Vse</option>
                                        <option value="Nizka">Nizka</option>
                                        <option value="Srednja">Srednja</option>
                                        <option value="Visoka">Visoka</option>
                                    </select>
                                </div>

                                <!-- Lokacija -->
                                <div class="mb-3">
                                    <label for="lokacija" class="form-label">Lokacija</label>
                                    <input type="text" class="form-control" id="lokacija" name="lokacija"
                                        placeholder="Kraj ali regija">
                                </div>

                                <!-- Spretnost -->
                                <div class="mb-3">
                                    <label for="spretnost" class="form-label">Zahtevana spretnost</label>
                                    <input type="text" class="form-control" id="spretnost" name="spretnost"
                                        placeholder="Vpiši spretnost">
                                </div>

                                <!-- Sortiranje -->
                                <div class="mb-4">
                                    <label for="sort" class="form-label">Sortiraj po</label>
                                    <select class="form-select" id="sort" name="sort">
                                        <option value="">Privzeto</option>
                                        <option value="datumIzvajanja_desc">Datum izvajanja (novejši)</option>
                                        <option value="datumIzvajanja_asc">Datum izvajanja (starejši)</option>
                                        <option value="datumRokaPrijave_asc">Rok prijave (najprej zapade)</option>
                                        <option value="naziv_asc">Naziv (A-Z)</option>
                                        <option value="naziv_desc">Naziv (Z-A)</option>
                                    </select>
                                </div>

                                <!-- Gumbi -->
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">Filtriraj</button>
                                    <button type="button" class="btn btn-secondary" id="resetFilters">Ponastavi
                                        filtre</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="row">
                        <!-- Search in Filter gumbi -->
                        <div class="search-controls-container">
                            <!-- Search bar -->
                            <div class="search-wrapper">
                                <div id="searchContainer" class="search-input-container w-100">
                                    <div class="input-group">
                                        <input type="text" class="form-control ps-4 diagonalCorner" id="searchInput"
                                            placeholder="Iskanje...">
                                        <button class="btn btn-primary" type="button" id="searchBtn">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- View Toggle in Filter gumbi -->
                            <div class="controls-wrapper">
                                <!-- ZEMLJEVID / PROJEKTI -->
                                <div class="view-toggle-container d-flex align-items-center bg-light rounded-pill p-1">
                                    <button type="button" class="view-toggle-btn active" data-view="projects">
                                        <i class="fas fa-th-large me-2"></i>
                                    </button>
                                    <button type="button" class="view-toggle-btn" data-view="map">
                                        <i class="fas fa-map-marked-alt me-2"></i>
                                    </button>
                                </div>

                                <!-- Filter gumb -->
                                <button class="btn btn-outline-light d-flex align-items-center justify-content-center" type="button"
                                    data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">
                                    <i class="fas fa-filter me-2"></i>
                                    Filtriraj
                                </button>
                            </div>
                        </div>
                        <div id="niProjektov" class="text-center py-5 my-4" style="display: none;">
                            <i class="fas fa-search fs-3 mb-3 d-block"></i>
                            <h6 class="fw-normal">Ni bilo najdenih projektov</h6>
                            <small>Poskusite z drugačnimi filtri</small>
                        </div>
                        <div class="row p-0 m-0 g-4" id="projectsContainer">
                            <!-- Trenuten templatee za psamezno kartico -->
                            <template id="projectTemplate">
                                <div class="col-lg-4 col-md-6">
                                    <div
                                        class="campaign-card diagonalCorner h-100 d-flex flex-column position-relative">
                                        <!-- Slika -->
                                        <div class="campaign-image position-relative">
                                            <img src="" alt="" class="diagonalCorner project-image w-100">
                                            <span
                                                class="badge project-difficulty position-absolute top-0 end-0 m-3 py-2 px-3 d-flex align-items-center">
                                                <i class="fas fa-person-hiking me-1" title="Težavnost projekta"></i>
                                                <span>Težavnost</span>
                                            </span>
                                            <!-- UrE pridobljene za vsakofga posameznika za delo -->
                                            <div class="position-absolute rounded-pill bg-danger text-white shadow-sm d-flex align-items-center py-1 px-3"
                                                style="bottom: 15px; right: 20px; z-index: 10;">
                                                <span class="project-duration-hours fs-1 fw-bold lh-1">6</span>
                                                <span class="small fw-medium ms-1">ur</span>
                                            </div>
                                        </div>
                                        <!-- Header -->
                                        <div class="p-4 flex-column flex-grow-1 d-flex justify-content-between gap-3">
                                            <div class="">
                                                <h3 class="campaign-title project-title fs-4 mb-1 overflow-hidden"
                                                    style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3;">
                                                    Project Title</h3>
                                                <p class="text-muted mb-2 project-organization small"><i
                                                        class="fas fa-building me-1"></i> <span>Organizacija</span></p>
                                            </div>
                                            <div class="campaignGreyLineH"></div>
                                            <div class="d-flex flex-column">
                                                <!-- lokaCIJa -->
                                                <div class="d-flex mb-2 small">
                                                    <div class="d-flex align-items-center">
                                                        <i class="fas fa-location-dot text-danger me-2"></i>
                                                        <span class="project-location">Lokacija</span>
                                                    </div>
                                                </div>
                                                <!-- Datumee -->
                                                <div class="d-flex flex-column small">
                                                    <div class="d-flex align-items-center mb-1">
                                                        <i class="fas fa-calendar-days text-primary me-2"></i>
                                                        <strong>Izvaja se:</strong> <span
                                                            class="project-date ms-1">Datum</span>
                                                    </div>
                                                    <div class="d-flex align-items-center">
                                                        <i class="fas fa-calendar-xmark text-info me-2"></i>
                                                        <strong>Prijave do:</strong> <span
                                                            class="project-deadline ms-1">Rok
                                                            prijave</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="campaignGreyLineH" style="width: 100%;"></div>
                                            <!-- Description -->
                                            <div class="">
                                                <p class="campaign-description project-description mb-3 text-dark fw-medium overflow-hidden text-uppercase"
                                                    style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; font-size: 1.1rem;">
                                                    Tu bo description projekta</p>
                                                <p class="project-goal mb-0 text-muted small">
                                                    <i class="fas fa-clipboard-check text-success me-1"
                                                        title="Cilj projekta"></i>
                                                    <span class="project-goal-text fst-italic">Cilj
                                                        projekta</span>
                                                </p>
                                            </div>
                                        </div>
                                        <button class="btn donate-btn" data-project-id="" title="Podrobnosti projekta">
                                            <i class="fas fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <nav aria-label="Project pagination" class="mt-5">
                            <ul class="pagination justify-content-center"></ul>
                        </nav>
                    </div>

                </div>
            </section>
        </main>
        <footer id="footer"></footer>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </div>
    <script>
        // Preberi filtre iz URL-ja in nastavi vrednosti v formi
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            ['tezavnost', 'lokacija', 'sort', 'spretnost'].forEach(param => {
                if (urlParams.get(param)) {
                    document.getElementById(param).value = urlParams.get(param);
                }
            });
            const filterForm = document.getElementById('filterForm');
            if (filterForm) {
                filterForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    const formData = new FormData(filterForm);
                    const newUrlParams = new URLSearchParams(window.location.search);

                    // Ohrani search parameter
                    const currentSearch = newUrlParams.get('search');
                    if (currentSearch) {
                        newUrlParams.set('search', currentSearch);
                    }

                    // Dodaj filter parametre
                    for (const [key, value] of formData.entries()) {
                        if (value.trim()) {
                            newUrlParams.set(key, value);
                        }
                    }

                    // Zapri sidebar
                    const sidebar = bootstrap.Offcanvas.getInstance(document.getElementById('filterSidebar'));
                    if (sidebar) sidebar.hide();

                    // Redirect
                    window.location.search = newUrlParams.toString();
                });
            }

            // Search funkcionalnost


            function performSearch() {
                const searchTerm = searchInput.value.trim();
                const urlParams = new URLSearchParams(window.location.search);

                if (searchTerm) {
                    urlParams.set('search', searchTerm);
                } else {
                    urlParams.delete('search');
                }

                urlParams.delete('page');
                window.location.search = urlParams.toString();
            }

            if (searchBtn) {
                searchBtn.addEventListener('click', performSearch);
            }
            if (searchInput) {
                searchInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }

            // Nastavi search vrednost
            const searchValue = urlParams.get('search');
            if (searchValue) {
                searchInput.value = searchValue;
            }

            // Ponastavi filtre
            document.getElementById('resetFilters').addEventListener('click', function () {
                window.location.search = '';
            });
            const viewToggleBtns = document.querySelectorAll('.view-toggle-btn');
            const viewToggleContainer = document.querySelector('.view-toggle-container');

            viewToggleBtns.forEach(btn => {
                btn.addEventListener('click', function () {
                    viewToggleBtns.forEach(b => b.classList.remove('active'));

                    this.classList.add('active');

                    const view = this.getAttribute('data-view');

                    if (view === 'map') {
                        viewToggleContainer.classList.add('map-active');
                    } else {
                        viewToggleContainer.classList.remove('map-active');
                    }

                    if (view === 'projects') {
                        // LIST PROJEKTOV
                        // TODO: PRIKAZE LIST MAPE, SKRIJE MAPOO
                    } else if (view === 'map') {
                        // MAPA
                        // TODO: SKKKRIJE LIST PROJEKTOV, PRIKAZE MAPO
                    }
                });
            });
        });
    </script>
</body>

</html>
