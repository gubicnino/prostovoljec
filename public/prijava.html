<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManusMano</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" defer></script>
    <script src="scripts/loader.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="scripts/preveriPrijavo.js" defer></script>
    <script src="/scripts/popup.js" defer></script>

</head>

<body>
    <header id="header" class="white-page"></header>

    <section class="prijavaRegistracija">
        <div class="container">
            <div class="prijavaRegistracijaWrapper">
                <h2 class="mb-4">Prijava</h2>
                <form id="loginForm" class="login-form needs-validation" name="login" method="post" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Uporabniško ime</label>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Vnesite uporabniško ime" required>
                        <div class="invalid-feedback">Prosimo, vnesite uporabniško ime.</div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Geslo</label>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Vnesite geslo" required>
                        <div class="invalid-feedback">Prosimo, vnesite geslo.</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Prijava</button>
                    <button type="reset" class="btn btn-secondary mx-3">Ponastavi</button>
                </form>
                
                <a href="registracija.html" class="d-block mt-3">Registriraj se</a>
                
                <div id="error-message" class="text-danger mt-3" style="display: none;"></div>
            </div>
        </div>
    </section>

    <footer id="footer"></footer>
    <script>
        (function () {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');
            Array.from(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>

</html>
