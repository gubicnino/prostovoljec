<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManusMano</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/loader.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>
<body>
    <div class="page-wrapper">
        <header id="header"></header>

        <main class="main-content">
              <section class="hero-section py-5">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-6">
                            <div class="orange-dot"></div>
                            <h1 class="hero-title">Podaj roko.<br><span class="redText">Spremeni življenje.</span><br>Začni danes.</h1>
                            <p class="hero-description">Vsak korak šteje. Tvoja prisotnost lahko komu pomeni vse.</p>
                            <button class="btn">Preglej projekte</button>
                        </div>
                        <div class="col-lg-6">
                            <div class="image-container">
                                <div class="image-overlay">
                                    <img src="img/heroImg.png" alt="Children in need" class="hero-image">
                                </div>
                            </div>
                            <div class="green-dot"></div>
                            <div class="blue-dot"></div>
                            <div class="red-dot"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer id="footer"></footer>
    </div>
</body>
</html>
